spring:
  application:
    name: date-manager-api
  datasource:
    url: ${DATEMANAGER_DB_URL}
    username: ${DATEMANAGER_DB_USUARIO}
    password: ${DATEMANAGER_DB_CLAVE}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      # Los textos se guardan en NVARCHAR (Unicode) en SQL Server.
      hibernate.use_nationalized_character_data: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

datemanager:
  zona-horaria: ${DATEMANAGER_ZONA_HORARIA:America/Bogota}
  cors-origenes: ${DATEMANAGER_CORS_ORIGENES:http://localhost:4200}
  jwt:
    # Obligatoria (>= 32 bytes): sin ella la aplicación no arranca.
    secreto: ${DATEMANAGER_JWT_SECRETO}
  admin:
    # Solo se usan si no hay ningún usuario al arrancar.
    usuario: ${DATEMANAGER_ADMIN_USUARIO:}
    clave: ${DATEMANAGER_ADMIN_CLAVE:}

# Swagger solo en el perfil dev.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
