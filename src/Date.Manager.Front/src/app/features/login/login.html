<main class="login">
  <section class="caja">
    <p class="marca">DateManager</p>
    <h1>Iniciar sesión</h1>

    @if (sesion.aviso(); as aviso) {
      <p class="aviso" role="status">{{ aviso }}</p>
    }

    <form (submit)="enviar($event)" novalidate>
      <label for="usuario">Usuario</label>
      <input id="usuario" name="usuario" type="text" autocomplete="username"
             [value]="usuario()" (input)="escribir('usuario', $event)" />

      <label for="clave">Clave</label>
      <input id="clave" name="clave" type="password" autocomplete="current-password"
             [value]="clave()" (input)="escribir('clave', $event)" />

      @if (error()) {
        <p class="error" role="alert">{{ error() }}</p>
      }

      <button type="submit" class="btn primario" [disabled]="ocupado()">Iniciar sesión</button>
    </form>
  </section>
</main>
