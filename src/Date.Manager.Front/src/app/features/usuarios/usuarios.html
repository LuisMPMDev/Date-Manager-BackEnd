<h2>Usuarios y roles</h2>

@if (falloCarga()) {
  <p class="alerta" role="alert">No se pudo cargar usuarios y roles.</p>
}

@if (cargado()) {
  @if (verUsuarios()) {
    <app-usuarios-seccion [usuarios]="usuarios()" [roles]="roles()" [avisoRoles]="avisoRoles()" (desactualizado)="recargar()" />
  }
  @if (verRoles()) {
    <app-roles-seccion [usuarios]="usuarios()" [roles]="roles()" [avisoUsuarios]="avisoUsuarios()" (desactualizado)="recargar()" />
  }
}
